name: CI

# Runs on every push to main and on every pull request, so a merge is gated by pipeline evidence
# rather than by someone having run the suites locally.
on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch cancels the run still in flight: the older result is about to be
# irrelevant, and leaving it running only delays the one that matters.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned to the same major the build targets via maven.compiler.release, so CI cannot pass on a
  # JDK the project does not claim to support.
  JAVA_VERSION: '21'

jobs:
  build:
    name: Build and application tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      # -DskipITs excludes the suites that need a running application; they run in the job below.
      # The application's own unit and integration tests do run here, so a broken build fails fast
      # before anything spends time starting a server.
      - name: Build all modules and run application tests
        run: mvn -B clean install -DskipITs

      # Passed to the automation job rather than rebuilt there: the suites must run against the same
      # artifact these tests just validated, not a second build of the same source.
      - name: Upload application jar
        uses: actions/upload-artifact@v4
        with:
          name: billing-app-jar
          path: billing-app/target/billing-app.jar
          retention-days: 5

      - name: Upload application test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-test-reports
          path: billing-app/target/surefire-reports/
          retention-days: 5

      # JaCoCo line and branch coverage for the application's own tests, produced by the build above at
      # no extra cost. This is in-process coverage only: it cannot see what the API, UI and BDD suites
      # exercise, because those drive a separate JVM. The full-stack figure needs the agent attached to
      # the application process and is produced by scripts/coverage.sh - see docs/coverage.md for why CI
      # publishes the narrower number rather than re-running every suite to widen it.
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-in-process
          path: billing-app/target/site/jacoco/
          retention-days: 5

      # The raw execution data rather than the rendered report: the coverage job merges this with what
      # the application process records while the black-box suites drive it.
      - name: Upload in-process execution data
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-exec-in-process
          path: billing-app/target/jacoco.exec
          retention-days: 5

  api-tests:
    name: API automation (REST Assured)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      # Installs the modules so the automation POMs resolve, without running anything.
      #
      # Both flags are needed: -DskipTests alone does not stop Failsafe 3.6.0 from executing the
      # integration suite, which then fails with connection refused because no application is
      # running yet. -DskipITs is the one that actually excludes it.
      #
      # This step must also precede the artifact download, because 'clean' would delete the jar.
      - name: Install modules without running tests
        run: mvn -B clean install -DskipITs -DskipTests

      - name: Download application jar
        uses: actions/download-artifact@v4
        with:
          name: billing-app-jar
          path: billing-app/target

      # Uses the same script a developer runs locally, so "works on my machine" and "works in CI"
      # cannot diverge. The script polls the health endpoint instead of sleeping a fixed interval.
      # JACOCO=true attaches the coverage agent to the application process. Without it this suite's
      # contribution to coverage is invisible: it drives the application over HTTP from another JVM,
      # and an in-process report cannot see a single line of what it exercises.
      - name: Start application with the coverage agent
        run: JACOCO=true scripts/start-app.sh

      - name: Run API regression suite
        run: mvn -B verify -pl qa-api-tests

      - name: Stop application
        if: always()
        run: scripts/stop-app.sh

      # The agent writes this file from a JVM shutdown hook, so it exists only because the stop step
      # above ran first. Merged with every other suite's data by the coverage job.
      - name: Upload api execution data
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-exec-api
          path: billing-app/target/jacoco-e2e.exec
          retention-days: 5

      - name: Upload API test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-reports
          path: qa-api-tests/target/failsafe-reports/
          retention-days: 5

      # Uploaded on failure only, because this is the artifact you want when a run goes red and the
      # reports alone do not explain why.
      - name: Upload application log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: app-log
          path: billing-app/target/app.log
          retention-days: 5

  ui-tests:
    name: UI automation (Selenium)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Install modules without running tests
        run: mvn -B clean install -DskipITs -DskipTests

      - name: Download application jar
        uses: actions/download-artifact@v4
        with:
          name: billing-app-jar
          path: billing-app/target

      # JACOCO=true attaches the coverage agent to the application process. Without it this suite's
      # contribution to coverage is invisible: it drives the application over HTTP from another JVM,
      # and an in-process report cannot see a single line of what it exercises.
      - name: Start application with the coverage agent
        run: JACOCO=true scripts/start-app.sh

      # Chrome is preinstalled on ubuntu-latest runners, and Selenium Manager resolves a matching
      # chromedriver at runtime, so there is nothing to install or pin here. The suite is headless by
      # default rather than by a CI-only override, so local and CI runs exercise the same mode.
      - name: Run UI regression suite
        run: mvn -B verify -pl qa-ui-tests

      - name: Stop application
        if: always()
        run: scripts/stop-app.sh

      # The agent writes this file from a JVM shutdown hook, so it exists only because the stop step
      # above ran first. Merged with every other suite's data by the coverage job.
      - name: Upload ui execution data
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-exec-ui
          path: billing-app/target/jacoco-e2e.exec
          retention-days: 5

      - name: Upload UI test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-reports
          path: qa-ui-tests/target/failsafe-reports/
          retention-days: 5

      # The screenshot of the moment a browser test failed is usually what explains it; by the time
      # the job ends the browser is gone.
      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-failure-screenshots
          path: qa-ui-tests/target/screenshots/
          retention-days: 5
          if-no-files-found: ignore

      - name: Upload application log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: app-log-ui
          path: billing-app/target/app.log
          retention-days: 5

  bdd-tests:
    name: BDD scenarios (Cucumber)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Install modules without running tests
        run: mvn -B clean install -DskipITs -DskipTests

      - name: Download application jar
        uses: actions/download-artifact@v4
        with:
          name: billing-app-jar
          path: billing-app/target

      # JACOCO=true attaches the coverage agent to the application process. Without it this suite's
      # contribution to coverage is invisible: it drives the application over HTTP from another JVM,
      # and an in-process report cannot see a single line of what it exercises.
      - name: Start application with the coverage agent
        run: JACOCO=true scripts/start-app.sh

      - name: Run Cucumber scenarios
        run: mvn -B verify -pl qa-bdd-tests

      - name: Stop application
        if: always()
        run: scripts/stop-app.sh

      # The agent writes this file from a JVM shutdown hook, so it exists only because the stop step
      # above ran first. Merged with every other suite's data by the coverage job.
      - name: Upload bdd execution data
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-exec-bdd
          path: billing-app/target/jacoco-e2e.exec
          retention-days: 5

      # The HTML reports are the readable artefact for these suites: they show which scenario and which
      # step failed, in business language, without anyone reading a stack trace.
      - name: Upload Cucumber reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-reports
          path: qa-bdd-tests/target/cucumber-reports/
          retention-days: 5

      - name: Upload scenario failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bdd-failure-screenshots
          path: qa-bdd-tests/target/screenshots/
          retention-days: 5
          if-no-files-found: ignore

  cypress-smoke:
    name: Smoke suite (Cypress)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: cypress/package-lock.json

      - name: Download application jar
        uses: actions/download-artifact@v4
        with:
          name: billing-app-jar
          path: billing-app/target

      # npm ci rather than npm install: it installs exactly the committed lockfile, so a transitive
      # release cannot change what CI runs without the lockfile change showing up in a diff.
      #
      # --ignore-scripts states what was already true and relied on. Cypress's postinstall hook is the
      # step that downloads the browser binary, and it does not run under an ignore-scripts policy -
      # which is why the explicit install and verify below exist at all. Turning the hook off here
      # makes CI behave the same way whatever the runner's npm defaults are, and closes the window
      # where a transitive package's lifecycle script executes with the repository checked out.
      #
      # The binaries are called by path rather than through npx. npx will fetch and run a package that
      # is not installed locally, so `npx cypress` silently becomes "download some version of Cypress"
      # the day node_modules is incomplete. The path form fails instead, which is the answer you want.
      - name: Install Cypress
        working-directory: cypress
        run: |
          npm ci --ignore-scripts
          ./node_modules/.bin/cypress install
          ./node_modules/.bin/cypress verify

      # Not instrumented, unlike the three suites above. This job deliberately never runs a Maven
      # build - it needs the jar artifact and Node, nothing else - so there is no JaCoCo agent jar
      # here to attach. Building the project just to collect coverage would add minutes to the job
      # for data that almost entirely duplicates what the Selenium suite already records.
      - name: Start application
        run: scripts/start-app.sh

      - name: Run Cypress smoke suite
        working-directory: cypress
        run: ./node_modules/.bin/cypress run

      - name: Stop application
        if: always()
        run: scripts/stop-app.sh

      - name: Upload Cypress screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: cypress/cypress/screenshots/
          retention-days: 5
          if-no-files-found: ignore

  # Full-stack coverage, static analysis, and the coverage figure that ends up on the badges.
  #
  # This job exists because the interesting coverage number cannot be produced by any single job above.
  # The application's own tests are measured in-process by the build job; everything the API, UI and
  # BDD suites exercise is recorded by the agent inside the *application* process, in three separate
  # jobs. Merging the four execution files is what turns 91% line coverage into 99%.
  #
  # The Cypress job is in `needs` but contributes nothing: it runs no Maven build, so no agent jar
  # exists there. Its coverage would duplicate the Selenium suite's almost exactly, which is not worth
  # adding a build to that job for.
  #
  # Nothing is re-run to get it. The suites already ran; this job collects what they recorded, which is
  # what makes measuring the full picture in CI affordable at all.
  coverage:
    name: Coverage and static analysis
    runs-on: ubuntu-latest
    needs: [build, api-tests, ui-tests, bdd-tests, cypress-smoke]
    env:
      # Job-level so the analysis step's condition can read it. A pull request from a fork gets no
      # repository secrets, so this is empty there and the step skips rather than failing.
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          # SonarQube Cloud uses the history to attribute issues and to work out what counts as new
          # code. With the default shallow clone every line looks new on every run.
          fetch-depth: 0

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      # The scanner downloads its analysers from the server otherwise, on every run, which is the
      # slowest part of the analysis and identical between runs.
      - name: Cache SonarQube Cloud analysers
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: sonar-${{ runner.os }}
          restore-keys: sonar-${{ runner.os }}

      # Compiles the classes the coverage report and the analysis are about. No tests: they have all
      # run already, and their results are what this job is assembling.
      #
      # It must also come before the download, because 'clean' would delete the execution files.
      - name: Build without running tests
        run: mvn -B clean install -DskipITs -DskipTests

      - name: Download every suite's execution data
        uses: actions/download-artifact@v4
        with:
          pattern: jacoco-exec-*
          path: coverage-data

      # The test reports, so the documented counts can be checked against what actually ran. See
      # DEF-014: the figures in the README and the docs used to be typed by hand and drifted apart
      # from the suite and from each other.
      - name: Download every suite's test reports
        uses: actions/download-artifact@v4
        with:
          pattern: '*-test-reports'
          path: test-reports

      - name: Download the Cucumber reports
        uses: actions/download-artifact@v4
        with:
          name: cucumber-reports
          path: cucumber-reports

      # Put each report back where scripts/count_tests.py expects to find it. The artifacts flatten
      # the module structure, so this rebuilds it rather than teaching the script about CI's layout -
      # the script has to work identically on a developer's machine, which is where it is run before
      # committing an updated inventory.
      - name: Reassemble the reports
        run: |
          mkdir -p billing-app/target/surefire-reports \
                   qa-api-tests/target/failsafe-reports \
                   qa-ui-tests/target/failsafe-reports \
                   qa-bdd-tests/target/cucumber-reports
          cp test-reports/app-test-reports/*.xml billing-app/target/surefire-reports/ 2>/dev/null || true
          cp test-reports/api-test-reports/*.xml qa-api-tests/target/failsafe-reports/ 2>/dev/null || true
          cp test-reports/ui-test-reports/*.xml qa-ui-tests/target/failsafe-reports/ 2>/dev/null || true
          cp cucumber-reports/*.json qa-bdd-tests/target/cucumber-reports/ 2>/dev/null || true

      # Two things are checked, and they fail for different reasons.
      #
      # The first regenerates the inventory from those reports and diffs it against the committed one:
      # it fails when the suite changed and nobody re-ran scripts/count-tests.sh.
      #
      # The second checks every figure quoted in the README and the docs against that inventory: it
      # fails when somebody edited a number by hand. A stale count now fails the pipeline exactly as a
      # broken test does.
      #
      # The API total legitimately differs here: the test-support group wipes the database and cannot
      # run in the parallel pipeline, so CI's reports are four tests short of a local full run. The
      # diff is therefore reported and not gated; check-doc-numbers.sh, which reads the committed
      # inventory, is the gate.
      - name: Check the documented test counts
        run: |
          scripts/count-tests.sh --check > /tmp/inventory-from-ci.md
          if ! diff -q /tmp/inventory-from-ci.md docs/test-inventory.md > /dev/null; then
            echo "::notice::The inventory regenerated from this run differs from the committed one."
            echo "Expected for the 4 test-support tests CI cannot run. Anything else means"
            echo "scripts/count-tests.sh needs re-running after a full local run."
            diff /tmp/inventory-from-ci.md docs/test-inventory.md || true
          fi
          scripts/check-doc-numbers.sh

      # Each artifact holds a file with the same name, so they are renamed on the way in. The merge
      # execution in billing-app/pom.xml picks up jacoco.exec and anything matching jacoco-e2e*.exec.
      - name: Collect the execution data
        run: |
          cp coverage-data/jacoco-exec-in-process/jacoco.exec billing-app/target/jacoco.exec
          for suite in api ui bdd; do
            cp "coverage-data/jacoco-exec-$suite/jacoco-e2e.exec" "billing-app/target/jacoco-e2e-$suite.exec"
          done
          ls -l billing-app/target/*.exec

      - name: Merge and render full-stack coverage
        run: mvn -B -pl billing-app jacoco:merge@merge-all-coverage jacoco:report@full-coverage-report

      - name: Upload full-stack coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-full-stack
          path: billing-app/target/site/jacoco-full/
          retention-days: 5

      # Codecov comments on the pull request with the coverage of the lines that pull request changed.
      # That is the figure worth reading on a diff; a project-wide percentage barely moves and says
      # nothing about the change in front of you.
      #
      # codecov.yml configures both statuses as informational: they report, they do not block. See
      # docs/code-quality.md for why this project has no coverage threshold.
      #
      # Pinned to a commit rather than to the v5 tag. A tag is a moving pointer the action's owner can
      # repoint at any time, and this step runs with a token: a compromised or simply changed action
      # would have it. The tag is recorded in the comment so the version is still readable.
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
        with:
          files: billing-app/target/site/jacoco-full/jacoco.xml
          flags: full-stack
          token: ${{ secrets.CODECOV_TOKEN }}
          # A coverage service that cannot be reached is not a reason to fail a build whose tests
          # passed.
          fail_ci_if_error: false

      # Static analysis: bugs, code smells, security hotspots and duplication, with the merged coverage
      # above imported alongside them.
      #
      # NOTE: this step has never executed. It needs a SONAR_TOKEN secret and a SonarQube Cloud project,
      # neither of which existed when it was written. docs/code-quality.md records the setup it needs and
      # exactly what was and was not verified.
      - name: SonarQube Cloud analysis
        if: env.SONAR_TOKEN != ''
        run: mvn -B sonar:sonar

