<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="#{term.title}">Terms</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<div th:replace="~{fragments/account :: context(${account})}"></div>

<div class="workspace">
  <div th:replace="~{fragments/account :: nav(${account}, ${activeNav})}"></div>

  <main class="workspace-main">
    <h1 data-testid="page-title" th:text="#{term.title}">Terms</h1>

    <p th:if="${selectedTerm == null}" data-testid="no-terms-message" th:text="#{account.terms.empty}">
      No terms are billed to this account.
    </p>

    <div th:if="${selectedTerm != null}">
      <!-- One tab strip per term. With more than one term the strip repeats, which is the honest
           rendering: each term has its own schedule and its own ledger. -->
      <div class="term-picker" th:if="${account.terms.size() > 1}" data-testid="term-picker">
        <a th:each="t : ${account.terms}"
           data-testid="term-option"
           th:attr="data-term=${t.termReference}"
           th:classappend="${t.termReference == selectedTerm.termReference} ? 'current' : ''"
           th:href="@{/accounts/{ref}/terms(ref=${account.accountReference}, term=${t.termReference})}"
           th:text="${t.policyNumber}"></a>
      </div>

      <div th:replace="~{fragments/term :: header(${selectedTerm})}"></div>
      <div th:replace="~{fragments/term :: tabs(${tabBasePath}, ${selectedTerm}, ${activeTab})}"></div>
      <th:block th:replace="~{fragments/term :: panels(${selectedTerm}, ${schedule}, ${ledger}, ${activeTab})}"></th:block>
    </div>
  </main>
</div>
</body>
</html>
