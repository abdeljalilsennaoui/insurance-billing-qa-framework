<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="#{invoice.title(${invoice.invoiceNumber})}">Invoice</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<main>
  <a th:href="@{/invoices}" data-testid="back-to-list-link" th:text="#{invoice.back}">Back to invoices</a>

  <h1 data-testid="page-title">
    <span th:text="#{invoices.column.invoice}">Invoice</span>
    <span data-testid="invoice-number" th:text="${invoice.invoiceNumber}"></span>
  </h1>

  <div th:if="${paymentSuccess}" class="banner success" data-testid="payment-success"
       th:text="${paymentSuccess}"></div>
  <div th:if="${paymentError}" class="banner error" data-testid="payment-error"
       th:text="${paymentError}"></div>

  <section class="summary">
    <dl>
      <dt th:text="#{invoice.customer}">Customer</dt>
      <dd data-testid="invoice-customer" th:text="${invoice.customerName}"></dd>

      <dt th:text="#{invoice.policy}">Policy</dt>
      <dd data-testid="invoice-policy" th:text="${invoice.policyNumber}"></dd>

      <dt th:text="#{invoice.status}">Status</dt>
      <dd>
        <span class="status" data-testid="invoice-status"
              th:attr="data-status=${invoice.status}"
              th:classappend="'status-' + ${invoice.status}"
              th:text="#{'status.' + ${invoice.status}}"></span>
        <span th:if="${invoice.overdue and invoice.status.name() != 'OVERDUE'}"
              class="overdue-flag" data-testid="invoice-overdue-flag"
              th:text="#{invoices.overdue}">overdue</span>
      </dd>

      <dt th:text="#{invoice.issued}">Issued</dt>
      <dd data-testid="invoice-issue-date"
          th:attr="data-date=${invoice.issueDate}"
          th:text="${@billingFormats.date(invoice.issueDate, #locale)}"></dd>

      <dt th:text="#{invoice.due}">Due</dt>
      <dd data-testid="invoice-due-date"
          th:attr="data-date=${invoice.dueDate}"
          th:text="${@billingFormats.date(invoice.dueDate, #locale)}"></dd>

      <dt th:text="#{invoice.total}">Total</dt>
      <dd class="numeric" data-testid="invoice-total"
          th:attr="data-amount=${invoice.totalAmount}"
          th:text="${@billingFormats.money(invoice.totalAmount, #locale)}"></dd>

      <dt th:text="#{invoice.paid}">Paid</dt>
      <dd class="numeric" data-testid="invoice-amount-paid"
          th:attr="data-amount=${invoice.amountPaid}"
          th:text="${@billingFormats.money(invoice.amountPaid, #locale)}"></dd>

      <dt th:text="#{invoice.outstanding}">Outstanding</dt>
      <dd class="numeric emphasis" data-testid="invoice-outstanding-balance"
          th:attr="data-amount=${invoice.outstandingBalance}"
          th:text="${@billingFormats.money(invoice.outstandingBalance, #locale)}"></dd>
    </dl>
  </section>

  <section>
    <h2 th:text="#{payments.history}">Payment history</h2>
    <p th:if="${invoice.payments.isEmpty()}" data-testid="no-payments-message" th:text="#{payments.empty}">
      No payments have been recorded against this invoice.
    </p>
    <table th:unless="${invoice.payments.isEmpty()}" data-testid="payment-table">
      <thead>
      <tr>
        <th class="numeric" th:text="#{payments.column.amount}">Amount</th>
        <th th:text="#{payments.column.method}">Method</th>
        <th th:text="#{payments.column.reference}">Reference</th>
        <th th:text="#{payments.column.received}">Received</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="payment : ${invoice.payments}" data-testid="payment-row">
        <td class="numeric" data-testid="payment-amount"
            th:attr="data-amount=${payment.amount}"
            th:text="${@billingFormats.money(payment.amount, #locale)}"></td>
        <td data-testid="payment-method"
            th:attr="data-method=${payment.method}"
            th:text="#{'method.' + ${payment.method}}"></td>
        <td data-testid="payment-reference" th:text="${payment.reference}"></td>
        <td data-testid="payment-received-at"
            th:attr="data-received-at=${payment.receivedAt}"
            th:text="${@billingFormats.dateTime(payment.receivedAt, #locale)}"></td>
      </tr>
      </tbody>
    </table>
  </section>

  <section>
    <h2 th:text="#{payments.record.title}">Record a payment</h2>

    <p th:if="${invoice.outstandingBalance.signum() == 0}" data-testid="fully-paid-message"
       th:text="#{payments.settled}">This invoice is settled in full.</p>
    <p th:if="${invoice.status.name() == 'CANCELLED'}" data-testid="cancelled-message"
       th:text="#{payments.cancelled}">This invoice is cancelled.</p>

    <form method="post"
          th:action="@{/invoices/{id}/payments(id=${invoice.id})}"
          th:object="${paymentForm}"
          data-testid="payment-form">
      <div class="field">
        <label for="amount" th:text="#{payments.record.amount}">Amount</label>
        <input type="text" id="amount" th:field="*{amount}"
               data-testid="payment-amount-input" autocomplete="off">
      </div>
      <div class="field">
        <label for="method" th:text="#{payments.record.method}">Method</label>
        <select id="method" th:field="*{method}" data-testid="payment-method-select">
          <option th:each="m : ${methods}" th:value="${m}" th:text="#{'method.' + ${m}}"></option>
        </select>
      </div>
      <div class="field">
        <label for="reference" th:text="#{payments.record.reference}">Reference</label>
        <input type="text" id="reference" th:field="*{reference}"
               data-testid="payment-reference-input" autocomplete="off">
      </div>
      <button type="submit" data-testid="submit-payment-button" th:text="#{payments.record.submit}">
        Record payment
      </button>
    </form>
  </section>
</main>
</body>
</html>
