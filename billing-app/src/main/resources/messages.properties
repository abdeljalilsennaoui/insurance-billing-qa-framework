# Refusals as the policyholder reads them. The API keeps its own English developer-facing message on
# the same rejection: an API message is read by one engineer, a console message by whoever holds the
# policy, and the two audiences do not want the same sentence.
rejection.AMOUNT_NOT_POSITIVE=Enter an amount greater than zero.
rejection.AMOUNT_SCALE_INVALID=Enter an amount in dollars and cents, for example 125.00.
rejection.EXCEEDS_OUTSTANDING_BALANCE=That payment of {0} exceeds the outstanding balance of {1}.
rejection.INVOICE_ALREADY_PAID=This invoice is already paid in full.
rejection.INVOICE_CANCELLED=This invoice is cancelled and cannot accept payments.
rejection.POLICY_NOT_ACTIVE=This policy is no longer active, so its invoices cannot be paid.
rejection.TERM_NOT_IN_FORCE=This policy term is not in force, so it cannot accept payments.
rejection.INSTALLMENT_ALREADY_PAID=That installment has already been paid.
rejection.PAYMENT_ALREADY_RETURNED=That payment has already been returned.
