spring:
  application:
    name: billing-app

  datasource:
    url: jdbc:h2:mem:billing;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

  h2:
    console:
      enabled: true
      path: /h2-console

  thymeleaf:
    cache: false

  # The console is published in English and French. UTF-8 is explicit because the French bundle carries
  # accented characters and a bundle read as ISO-8859-1 renders them as mojibake rather than failing,
  # which is the kind of defect that survives a whole release.
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false

server:
  port: 8080
  servlet:
    session:
      # Cookie-only session tracking. Without this, Tomcat falls back to appending
      # ';jsessionid=...' to URLs whenever a client has no cookie yet, which puts the session id
      # into redirect targets, logs and Referer headers, and makes UI URL assertions
      # non-deterministic.
      tracking-modes: cookie

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

# The time zone the billing day is reckoned in. Every business date decision — above all whether an
# invoice is OVERDUE — is made in this zone, not in the JVM's default one, so the same instant
# produces the same invoice status on a developer laptop, a UTC CI runner and a production host.
# Any IANA zone id is accepted; an unknown one fails startup rather than falling back silently.
billing:
  time-zone: America/Toronto

  # What a returned payment costs the policyholder. Configuration rather than a constant because it is
  # a commercial figure that changes without the billing rules changing, and because a test that wants
  # to prove the fee is applied should not have to know what it is.
  nsf-fee: 25.00

# QA support endpoints (database reset) are disabled unless explicitly switched on.
# CI and local automation runs enable them with --qa.test-support.enabled=true so that a
# production-shaped deployment can never expose them by accident.
qa:
  test-support:
    enabled: false

logging:
  level:
    root: INFO
    com.insurancebilling: INFO
